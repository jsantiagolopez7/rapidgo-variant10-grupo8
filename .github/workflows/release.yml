name: Release RapidGo

# Quality gate de la Semana 4: el release solo se publica si TODAS las pruebas pasan.
# Se ejecuta a mano desde Actions -> "Release RapidGo" -> "Run workflow" (rama main).
# Cada integrante puede correrlo con publicar = false para dejar su ejecución
# (workflow_dispatch) sin crear el release. Solo la última corrida usa publicar = true.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag del release"
        required: true
        default: "v1.0.0"
      publicar:
        description: "Crear el tag y el GitHub Release si el quality gate pasa"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  pruebas:
    name: Quality gate · pruebas y docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Configurar Java (PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Validar sintaxis Python
        run: python -m compileall producer spark tests airflow

      - name: Ejecutar pruebas
        run: pytest -v

      - name: Validar Docker Compose
        run: docker compose config --quiet

  dag:
    name: Quality gate · DAG de Airflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Airflow (con constraints oficiales)
        run: |
          pip install "apache-airflow==2.10.5" pandas pyarrow \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt"
          pip install pytest

      - name: Validar importación y estructura del DAG
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
        run: pytest tests/test_dag_integrity.py -v

  publicar:
    name: Publicar release
    needs: [pruebas, dag]          # si cualquiera de los dos falla, no se libera
    if: ${{ inputs.publicar && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Crear tag y GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "::error::El release $VERSION ya existe."
            exit 1
          fi
          NOTAS="docs/release-notes-${VERSION}.md"
          if [ ! -f "$NOTAS" ]; then
            echo "::error::Falta $NOTAS"
            exit 1
          fi
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION · RapidGo Variante 10 · Grupo 8" \
            --notes-file "$NOTAS"
